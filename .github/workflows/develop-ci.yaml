name: CI on Develop

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

permissions:
  contents: read

jobs:
  lint-and-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - run: npm install
      - run: npm install -g htmlhint stylelint stylelint-config-standard

      - run: htmlhint "src/**/*.html" .htmlhintrc
      - run: stylelint "**/*.css"
      - run: npx parcel build src/index.html --dist-dir dist
